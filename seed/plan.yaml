    - {type: MONOCRYSTALLINE, power: [400, 720], efficiency: [20.0, 23.2], area: [1.9, 3.1], weight: [21.0, 38.0], count: 26}
    - {type: POLYCRYSTALLINE, power: [270, 400], efficiency: [16.0, 18.5], area: [1.6, 2.0], weight: [17.0, 24.0], count: 13}
    - {type: THIN_FILM, power: [100, 250], efficiency: [11.0, 14.5], area: [1.2, 2.2], weight: [14.0, 22.0], count: 6}
  price_per_wp: [2.2, 3.9]
  # casos de borda: modelos nao aprovados, ofertas expiradas, pausadas e sem estoque
  edge: {under_analysis_models: 3, rejected_models: 2, expired_offer_ratio: 0.10, paused_offer_ratio: 0.05, no_stock_ratio: 0.10}

