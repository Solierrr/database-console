# Compras de demonstracao (pagamentos ficticios). O estoque da oferta e descontado so dos pedidos PAID.
# Comprador: demandant (admin de uma empresa demandante) ou professional (profissional registrado). Fornecedor nunca compra.
orders:
  fee_percentage: 0.005
  purchases:
    - {buyer: demandant, status: PAID, method: PIX, suppliers: 1, items: 2, days: -12}
    - {buyer: demandant, status: PAID, method: CREDIT_CARD, suppliers: 2, items: 3, days: -5}
    - {buyer: professional, status: CANCELED, method: BOLETO, suppliers: 1, items: 1, days: -9}
    - {buyer: professional, status: PAID, method: TRANSFER, suppliers: 2, items: 2, days: -2}
  carts:
    - {buyer: demandant, buyer_index: 3, suppliers: 2, items: 3}
    - {buyer: professional, buyer_index: 5, suppliers: 1, items: 2}

# Permissoes padrao por cargo (ADMIN passa por tudo e nao precisa de linhas). Nomes exatos do catalogo `permission`.
# Menor privilegio: SUPPORT e TECHNICIAN leem; SALES cuida da parte comercial; MANAGER opera a empresa, mas nao governa
# cargos/permissoes nem demite. A gestao de cargos e permissoes fica so com ADMIN.
position_permissions:
  SUPPORT:
    - GET /api/offers/company/{companyId}
    - GET /api/offers/{id}/history
    - GET /api/models
    - GET /api/models/status/{status}
    - GET /api/local-units/company/{companyId}
    - GET /api/requesters/company/{companyId}
    - GET /api/suppliers/company/{companyId}
    - GET /api/user-companies/company/{companyId}
    - GET /api/access-codes/company/{companyId}
    - GET /api/professional-teams/company/{companyId}
    - GET /api/company-positions/company/{companyId}
    - GET /api/users/{id}
  TECHNICIAN:
    - GET /api/models
    - GET /api/models/status/{status}
    - GET /api/professional-teams/company/{companyId}
    - GET /api/users/{id}
  SALES:
    - POST /api/offers
    - PUT /api/offers/{id}
    - DELETE /api/offers/{id}
    - PATCH /api/offers/{id}/status
    - GET /api/offers/company/{companyId}
    - GET /api/offers/{id}/history
    - POST /api/models
    - PUT /api/models/{id}
    - GET /api/models
    - GET /api/models/status/{status}
    - GET /api/suppliers/company/{companyId}
    - GET /api/users/{id}
  MANAGER:
    - POST /api/offers
    - PUT /api/offers/{id}
    - DELETE /api/offers/{id}
    - PATCH /api/offers/{id}/status
    - GET /api/offers/company/{companyId}
    - GET /api/offers/{id}/history
    - POST /api/models
    - PUT /api/models/{id}
    - DELETE /api/models/{id}
    - GET /api/models
    - GET /api/models/status/{status}
    - POST /api/local-units
    - PUT /api/local-units/{id}
    - DELETE /api/local-units/{id}
    - GET /api/local-units/company/{companyId}
    - GET /api/requesters/company/{companyId}
    - GET /api/suppliers/company/{companyId}
    - POST /api/geolocalizations
    - POST /api/access-codes
    - GET /api/access-codes/company/{companyId}
    - DELETE /api/access-codes/{id}/company/{companyId}
    - GET /api/user-companies/company/{companyId}
    - GET /api/company-positions/company/{companyId}
