name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-password-for-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install --only-binary :all: psycopg2-binary==2.9.12 python-dotenv==1.2.2

      - name: Build
        run: python -m compileall -q scripts seed

      - name: Test
        env:
          SOLARIA_TEST_PG_DSN: postgresql://postgres:test-password-for-ci@localhost:5432/postgres
        run: python -m unittest tests.test_roles -v
