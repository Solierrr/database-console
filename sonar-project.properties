sonar.projectKey=Solierrr_database-console
sonar.organization=solierrr

sonar.sources=db,docker,scripts,seed
sonar.tests=tests

# Ferramentas de desenvolvimento do banco: gerador de dados fictícios (números pseudoaleatórios de propósito),
# credenciais de desenvolvimento local e o executor de migrações, que roda os arquivos .sql do próprio repositório.
sonar.exclusions=seed/**,scripts/dataload.py,scripts/dev-stack.sh,scripts/migrate.py
sonar.cpd.exclusions=db/**,seed/**,tests/**
