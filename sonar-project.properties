sonar.projectKey=Solierrr_database-console
sonar.organization=solierrr

sonar.sources=db,docker,scripts,seed
sonar.tests=tests

# Ferramentas de desenvolvimento do banco: gerador de dados fictícios (números pseudoaleatórios de propósito),
# e credenciais de desenvolvimento local.
sonar.exclusions=seed/**,scripts/dataload.py,scripts/dev-stack.sh
sonar.cpd.exclusions=db/**,seed/**,tests/**

# python:S2245 (gerador pseudoaleatorio): o seed e o dataload geram dados ficticios de forma deterministica, com semente
# fixa, para que as cargas sejam reproduziveis. Nao ha uso criptografico nem segredo. A regra e ignorada so nesses caminhos.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/dataload.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.e2.resourceKey=seed/**
